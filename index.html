<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #fff8f0; color: #5a4632; }
    .hero { text-align: center; padding: 60px 20px; background: #fce4d6; }
    .hero h1 { font-size: 42px; margin: 0; color: #c97b63; }
    .hero p { font-size: 20px; }
    .section { max-width: 600px; margin: 0 auto; padding: 40px 20px; text-align: center; }
    .section h2 { color: #c97b63; }
    .btn { display: inline-block; background: #c97b63; color: white; padding: 15px 30px;
           border-radius: 30px; text-decoration: none; font-size: 18px; margin-top: 20px; }
    .mapa iframe { width: 100%; height: 300px; border: 0; }
  </style>
</head>
<body>

  <div class="hero">
    <h1>¡Nos llega un bebé!</h1>
    <p>Baby shower de [Nombre del bebé]</p>
    <p>📅 [Fecha] &nbsp; ⏰ [Hora]</p>
  </div>

  <div class="section">
    <h2>📍 Ubicación</h2>
    <p>[Dirección del lugar]</p>
    <div class="mapa">
      <!-- Aquí va el mapa de Google -->
    </div>
  </div>

  <div class="section">
    <h2>🎁 Regalos</h2>
    <p>[Detalle de lista de regalos si quieres]</p>
  </div>

  <div class="section">
    <a class="btn" href="https://wa.me/593999999999" target="_blank">Confirmar asistencia por WhatsApp</a>
  </div>

</body>
</html>
