<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baby Shower de Julián</title>
  <!-- Fuente linda de Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      margin: 0;
      background: #eaf6ff; /* celeste muy claro */
      color: #1b4d6e; /* azul oscuro para texto */
    }
    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(#d6ecff, #eaf6ff);
    }
    .hero h1 {
      font-family: 'Dancing Script', cursive;
      font-size: 56px;
      margin: 0;
      color: #3a8fc9; /* celeste medio */
    }
    .hero p {
      font-size: 20px;
      margin: 8px 0;
    }
    .elefante {
      width: 200px;
      height: 200px;
      margin: 20px auto;
      background: #a8d4f0; /* celeste suave */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 90px;
    }
    .section {
      max-width: 600px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
    }
    .section h2 {
      font-family: 'Dancing Script', cursive;
      font-size: 36px;
      color: #3a8fc9;
      margin-bottom: 10px;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(58, 143, 201, 0.15);
      margin: 15px 0;
      border: 2px solid #d6ecff;
    }
    .btn {
      display: inline-block;
      background: #3a8fc9;
      color: white;
      padding: 16px 35px;
      border-radius: 30px;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      margin-top: 20px;
      box-shadow: 0 4px 12px rgba(58, 143, 201, 0.3);
    }
    .btn:hover { background: #2f7ab0; }
    .mapa iframe { width: 100%; height: 300px; border: 0; border-radius: 15px; }
    .footer {
      text-align: center;
      padding: 30px;
      background: #d6ecff;
      color: #3a8fc9;
      font-size: 18px;
    }
  </style>
</head>
<body>

  <div class="hero">
    <div class="elefante">🐘</div>
    <h1>¡Nos llega un bebé!</h1>
    <p>Baby shower de <strong>[Julián]</strong></p>
    <p>📅 [19 de Septiembre] &nbsp; ⏰ [14H00]</p>
  </div>

  <div class="section">
    <div class="card">
      <h2>📍 Ubicación</h2>
      <p>[Dirección del lugar]</p>
      <div class="mapa">
        <!-- Aquí va el mapa de Google -->https://maps.app.goo.gl/dFQFM7UnCNzhNDsz8?g_st=aw
      </div>
    </div>
  </div>

  <div class="section">
    <div class="card">
      <h2>🎁 Regalos</h2>
      <p>[Gracias por tu regalito]</p>
    </div>
  </div>

  <div class="section">
    <a class="btn" href="https://wa.me/593999999999" target="_blank">💬 Confirmar asistencia</a>
  </div>

  <div class="footer">
    🐘 ¡Te esperamos! 🐘
  </div>

</body>
</html>
